# Apex Velo token broker. Deploy steps: README.md. Nothing here is secret: the Strava client id and secret
# are Worker secrets (`wrangler secret put STRAVA_CLIENT_ID`, `wrangler secret put STRAVA_CLIENT_SECRET`).
name = "apex-velo-broker"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
# Request logs are status and timing only (src/index.ts); no tokens, codes or addresses.
observability = { enabled = true }

[vars]
# App attestation (Play Integrity): "off", "report" (verify and log, never block) or "enforce". README.md.
ATTESTATION = "off"

# Per-IP limits (Workers rate-limit bindings). Without them the broker refuses every request (fails closed).
# Sized for carrier-grade NAT, where many riders share one address: a rider makes a handful of token calls a day
# (one per sign-in, one per 6-hour token), so 100 a minute per address still stops bulk use. Keying on the token
# instead would let one caller pass the limit by sending made-up tokens.
# namespace_id: any number unique within the Cloudflare account.
[[ratelimits]]
name = "TOKEN_LIMITER"
namespace_id = "41001"
simple = { limit = 100, period = 60 }

[[ratelimits]]
name = "CONFIG_LIMITER"
namespace_id = "41002"
simple = { limit = 300, period = 60 }
