import groovy.json.JsonSlurper
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// versionName comes from mobile/package.json, versionCode is 1000 + the CI run number (1000 for local builds),
// so every CI build installs over the previous one and Play accepts each upload. The 1000 offset keeps codes
// above any already on Play if the workflow is ever re-created and its run numbers start again at 1.
def appVersion = new JsonSlurper().parse(rootProject.file('../package.json')).version
def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()

// Release signing, from environment variables (CI) or Gradle properties (~/.gradle/gradle.properties).
// Without them the release build is left unsigned; debug builds never need them. See mobile/README.md.
def releaseValue = { String name -> System.getenv(name) ?: project.findProperty(name) }
def releaseStoreFile = releaseValue('ANDROID_KEYSTORE_FILE')
def hasReleaseKey = releaseStoreFile && releaseValue('ANDROID_KEYSTORE_PASSWORD') && releaseValue('ANDROID_KEY_ALIAS') && releaseValue('ANDROID_KEY_PASSWORD')

android {
    namespace = "com.apexvelo.lab"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.apexvelo.lab"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1000 + runNumber
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // A fixed, public debug key (password "android", like Android's own debug key) so APKs from
        // any machine or CI run update each other without uninstalling, which would erase the rides
        // stored in the app. Not for store releases.
        debug {
            storeFile file('apex-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseKey) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseValue('ANDROID_KEYSTORE_PASSWORD')
                keyAlias releaseValue('ANDROID_KEY_ALIAS')
                keyPassword releaseValue('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // Its own app id ("Apex Velo (dev)", src/debug/res) so it installs next to the release app:
            // the two are signed with different keys, so neither could update the other anyway.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug.${runNumber}"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21 // matches compileOptions in capacitor.build.gradle
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.work:work-runtime:$androidxWorkVersion"
    implementation project(':capacitor-android')
    // Health Connect (src/main/java/com/apexvelo/lab/plugins/Health*.kt)
    implementation "androidx.health.connect:connect-client:$healthConnectVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20240303' // the real org.json for JVM tests (android.jar only has stubs)
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
