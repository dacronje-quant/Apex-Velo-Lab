name: Local app checks
on: [push, pull_request]
jobs:
  node:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/run-tests.cjs
      - run: node scripts/check-share.cjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node tests/sqlite-browser.cjs
      - run: node tests/phone-pairing-browser.cjs
      - run: npm run test:browser
      - run: npm run test:suite
      - run: node tests/ramp-test-browser.cjs
      - run: node tests/ftp-history-browser.cjs
      - run: node tests/ftp-history-live-browser.cjs
