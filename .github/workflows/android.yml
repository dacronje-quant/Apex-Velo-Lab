name: Android app
on:
  push:
    paths: ['mobile/**', 'index.html', 'js/**', 'css/**', 'vendor/**', 'apex-velo-icon*', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'index.html', 'js/**', 'css/**', 'vendor/**', 'apex-velo-icon*', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apex-velo-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-output
          path: mobile/test-output/
          if-no-files-found: ignore
